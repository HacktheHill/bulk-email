name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  cache: npm
            - run: npm ci
            - run: npm run build
            - run: npm test
            - run: npm audit --omit=dev --audit-level=high
            - run: npm audit --audit-level=high
