name: Application reminders
run-name: reminder-${{ inputs.segment || 'general' }}-${{ inputs.execute_send && 'send' || github.event_name == 'schedule' && 'send' || 'preview' }}

on:
  workflow_dispatch:
    inputs:
      segment:
        type: choice
        options: [incomplete, general]
        required: true
      execute_send:
        type: boolean
        default: false
        description: Send after the test emails and campaign have been approved
  schedule:
    - cron: '0 22 13 9 *'

permissions:
  contents: read
  actions: read

concurrency:
  group: application-reminders-2026
  cancel-in-progress: false

jobs:
  campaign:
    if: github.event_name != 'schedule' || vars.REMINDER_CAMPAIGNS_APPROVED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      SEGMENT: ${{ inputs.segment || 'general' }}
      EXECUTE_SEND: ${{ inputs.execute_send || github.event_name == 'schedule' }}
      APPROVED: ${{ vars.REMINDER_CAMPAIGNS_APPROVED }}
      TALLY_API_KEY: ${{ secrets.TALLY_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
      EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
      SES_CONFIGURATION_SET: ${{ secrets.SES_CONFIGURATION_SET }}
      SUBSCRIBER_EXPORT_URL: ${{ secrets.SUBSCRIBER_EXPORT_URL }}
      SUBSCRIBER_EXPORT_TOKEN: ${{ secrets.SUBSCRIBER_EXPORT_TOKEN }}
      SUPPRESSION_CHECK_URL: ${{ secrets.SUPPRESSION_CHECK_URL }}
      SUPPRESSION_CHECK_TOKEN: ${{ secrets.SUPPRESSION_CHECK_TOKEN }}
      UNSUBSCRIBE_BASE_URL: ${{ secrets.UNSUBSCRIBE_BASE_URL }}
      UNSUBSCRIBE_TOKEN_ACTIVE_KEY_ID: ${{ secrets.UNSUBSCRIBE_TOKEN_ACTIVE_KEY_ID }}
      UNSUBSCRIBE_TOKEN_KEYS: ${{ secrets.UNSUBSCRIBE_TOKEN_KEYS }}
    steps:
      - name: Require approval and prevent duplicate send attempts
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName === 'schedule' && new Date().toISOString().slice(0, 10) !== '2026-09-13') {
              throw new Error('This schedule is only for 13 September 2026');
            }
            if (process.env.EXECUTE_SEND !== 'true') return;
            if (process.env.APPROVED !== 'true') throw new Error('Campaign review approval is required');
            if (context.ref !== 'refs/heads/main') throw new Error('Production sends must use main');
            if (Number(process.env.GITHUB_RUN_ATTEMPT) !== 1) throw new Error('Do not rerun a send; reconcile its SES results first');
            const title = `reminder-${process.env.SEGMENT}-send`;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'application-reminders.yml', per_page: 100
            });
            if (runs.some(run => run.id < context.runId && run.display_title === title)) {
              throw new Error('A previous send attempt exists for this segment; reconcile before retrying');
            }
      - uses: actions/checkout@v7
        with:
          path: bulk-email
      - uses: actions/checkout@v7
        with:
          repository: HacktheHill/react-email-templates
          ref: 6be91075b780cd338109673d24581fddad1289b8
          token: ${{ secrets.TEMPLATES_REPO_TOKEN }}
          path: react-email-templates
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: bulk-email/package-lock.json
      - run: npm ci && npm run verify
        working-directory: bulk-email
      - run: npm ci && npm run verify
        working-directory: react-email-templates
      - name: Refresh audiences and run campaign preflight
        working-directory: bulk-email
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install tsx src/prepare-reminders.ts
          if [ "$SEGMENT" = incomplete ]; then
            args=(--template application-completion-reminder.tsx --file .bulk-email/audiences/incomplete.csv --exclude-file .bulk-email/audiences/completed.csv --respect-list-suppressions --purpose 'One reminder to finish an application that the recipient already started')
          elif [ "$SEGMENT" = general ]; then
            args=(--template application-reminder.tsx --exclude-file .bulk-email/audiences/general-exclusions.csv)
          else
            exit 1
          fi
          npm start -- send --campaign-id "hth3-reminder-2026-$SEGMENT" --template-dir ../react-email-templates/emails/hackthehill "${args[@]}" --dry-run
          if [ "$EXECUTE_SEND" = true ]; then
            npx --no-install tsx src/prepare-reminders.ts
            npm start -- send --campaign-id "hth3-reminder-2026-$SEGMENT" --template-dir ../react-email-templates/emails/hackthehill "${args[@]}" --yes
          fi
      - name: Remove temporary recipient files
        if: always()
        working-directory: bulk-email
        run: rm -f .bulk-email/audiences/*.csv
